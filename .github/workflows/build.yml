name: build

# 推送到 main、提 PR 时：跑测试，构建安卓 APK 和 Windows 安装程序（在 Actions 页面可下载）。
# 推送版本 tag（如 v1.0.0）时：额外创建 GitHub Release，附上 APK 和 MSI。
#
# 安卓发布版签名需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ANDROID_KEYSTORE_BASE64（密钥库文件的 base64）、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
# 必须一直用同一把密钥，已安装的设备才能覆盖升级；没有配置时 APK 用构建机临时生成的调试密钥签名，
# 无法覆盖安装已有的版本。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # VLC 播放内核（Windows 版随程序分发）
  VLC_VERSION: 3.0.24

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag 必须形如 v1.2.3，实际是 $GITHUB_REF_NAME"; exit 1; }
            major=${v%%.*}
            (( major >= 1 && major <= 255 )) || { echo "主版本号要在 1 到 255 之间（MSI 的限制）"; exit 1; }
            echo "app=$v" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: gradle/actions/setup-gradle@v4
      - name: 安卓 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: 数据层与安卓单元测试
        run: ./android-tv/gradlew -p android-tv :core:test :app:testDebugUnitTest
      - name: 串流服务测试
        run: node --test desktop-server/

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: 安卓 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: 签名密钥
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SUPERTV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64：APK 用临时调试密钥签名，不能覆盖安装已有的版本"
          fi
      - name: 构建 APK
        env:
          SUPERTV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUPERTV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUPERTV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.version.outputs.app }}
        run: |
          ./android-tv/gradlew -p android-tv :app:assembleRelease ${APP_VERSION:+-PappVersion=$APP_VERSION}
          mkdir -p dist
          cp android-tv/app/build/outputs/apk/release/app-release.apk "dist/SuperTV-${APP_VERSION:-dev}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk, if-no-files-found: error }

  windows:
    needs: [version, test]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: 下载并校验 Node.js（最新 LTS，随程序分发）与 VLC
        run: |
          $ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'
          $tools = Join-Path $env:GITHUB_WORKSPACE '.desktop-tools'; $tmp = $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force "$tools\node" | Out-Null

          $node = ((Invoke-RestMethod https://nodejs.org/dist/index.json) | Where-Object { $_.lts } | Select-Object -First 1).version
          $zip = "node-$node-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$node/$zip" -OutFile "$tmp\$zip"
          $sum = ((Invoke-WebRequest "https://nodejs.org/dist/$node/SHASUMS256.txt").Content -split "`n" | Where-Object { $_ -match " $([regex]::Escape($zip))$" }).Split(' ')[0]
          if ((Get-FileHash "$tmp\$zip" -Algorithm SHA256).Hash -ne $sum.ToUpper()) { throw "Node.js 校验失败" }
          Expand-Archive "$tmp\$zip" $tmp
          Copy-Item "$tmp\node-$node-win-x64\node.exe" "$tools\node\node.exe"
          "Node.js $node"

          $v = $env:VLC_VERSION; $zip = "vlc-$v-win64.zip"; $base = "https://download.videolan.org/pub/videolan/vlc/$v/win64"
          Invoke-WebRequest "$base/$zip" -OutFile "$tmp\$zip"
          Invoke-WebRequest "$base/$zip.sha256" -OutFile "$tmp\$zip.sha256"; $sum = ((Get-Content "$tmp\$zip.sha256" -Raw) -split '\s+')[0]
          if ((Get-FileHash "$tmp\$zip" -Algorithm SHA256).Hash -ne $sum.ToUpper()) { throw "VLC 校验失败" }
          Expand-Archive "$tmp\$zip" $tmp
          Move-Item "$tmp\vlc-$v" "$tools\vlc"
          "VLC $v"
      - name: 构建安装程序
        env:
          APP_VERSION: ${{ needs.version.outputs.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tasks = @('packageMsi')
          if ($env:APP_VERSION) { $tasks += "-PappVersion=$env:APP_VERSION" }
          ./desktop/gradlew.bat -p desktop @tasks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path desktop/build/app-resources/common/vlc/plugins/plugins.dat)) { throw "没有生成 VLC 插件缓存" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = if ($env:APP_VERSION) { $env:APP_VERSION } else { 'dev' }
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName "dist/SuperTV-$name.msi"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.msi, if-no-files-found: error }

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          - **SuperTV-${{ needs.version.outputs.app }}.msi**：Windows 电脑端安装程序（自带播放内核和串流服务，不需要另装 Node.js 或 VLC）。
          - **SuperTV-${{ needs.version.outputs.app }}.apk**：安卓手机、电视 / 投影仪通用安装包，覆盖安装即可升级。
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "SuperTV $TAG" --notes-file notes.md --verify-tag
